# Run linters and unit tests on the available Python 3 interpreter.  CI runs
# the latest Python via 'tox -e py3', so there's no version list to maintain.
[tox]
envlist = py3

# Run unit tests
[testenv]
setenv =
  PYTHONPATH = {toxinidir}
extras = dev
commands =
  ruff check agiocli tests
  ruff format --check agiocli tests
  check-manifest
  pytest -vvs --cov agiocli
